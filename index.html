.pc { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border-radius: 24px; background: var(--ds-surface); box-shadow: var(--ds-shadow-1); color: var(--ds-ink); font-family: var(--ds-font); text-align: left; }

.pc-danger { background: var(--ds-neg-soft); color: var(--ds-neg); }

  --ds-glass: rgba(24, 40, 70, 0.62);

  --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;

}
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 340px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.012em;
}
/* ── fin de los tokens comunes ── */

/* Variables propias de las apps de cuentas, ahora tomadas del sistema común */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-ds]), :root[data-theme] {
  --bg: var(--ds-bg); --surface: var(--ds-surface); --ink: var(--ds-ink); --muted: var(--ds-ink-2); --line: var(--ds-line-2);
  --track: var(--ds-fill); --seg-on: var(--ds-surface); --accent: var(--ds-tint); --accent-bg: var(--ds-tint-soft); --on-accent: var(--ds-on-btn);
  --in: var(--ds-pos); --in-bg: var(--ds-pos-soft); --over: var(--ds-neg); --over-bg: var(--ds-neg-soft);
  --card-a: var(--ds-b2); --card-b: var(--ds-b1); --card-shade: rgba(14, 27, 80, 0.32); --card-edge: rgba(255, 255, 255, 0.22);
  --on-card: var(--ds-hero-ink); --on-card-muted: var(--ds-hero-ink-2); --on-card-line: var(--ds-hero-line);
  --lime: #FFFFFF; --lime-ink: var(--ds-b1); --warn-soft: #FFE3A3; --busy: #F5A524; --scrim: var(--ds-scrim);
  --gold: var(--ds-b5); --gold-soft: #FFE3A3; --gold-line: var(--ds-b2);
  --ember: var(--ds-b5); --amber: #FFE3A3; --alarm: #FF8A80;
  --dot-1: var(--ds-b5); --dot-2: var(--ds-b4); --dot-3: var(--ds-b3); --dot-4: #FFFFFF;
  --tit: var(--ds-b1); --tit-ink: #2141D6; --tit-bg: var(--ds-tint-soft);
  --adi: #2E9BD6; --adi-ink: #146896; --adi-bg: #DDF3FC;
  --font-display: var(--ds-font-display); --font-body: var(--ds-font);
  --piti: #2950F4; --piti-bg: #E5ECFE; --emi: #0B85BD; --emi-bg: #DCF2FB; --on-person: #FFFFFF;
  --done: var(--ds-pos); --done-bg: var(--ds-pos-soft); --on-done: #FFFFFF; --warn: var(--ds-warn);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --on-person: #0A1224; --on-done: #0A1224;
    --tit: #8EB0FA; --tit-ink: #B9CDFC; --tit-bg: rgba(113, 157, 246, 0.18);
    --adi: #7FD3F5; --adi-ink: #BDEBFB; --adi-bg: rgba(127, 211, 245, 0.15);
  }
}
:root[data-theme="dark"] {
    --piti: #8EB0FA; --piti-bg: rgba(113, 157, 246, 0.18); --emi: #7FD3F5; --emi-bg: rgba(127, 211, 245, 0.15); --on-person: #0A1224; --on-done: #0A1224;
  --tit: #8EB0FA; --tit-ink: #B9CDFC; --tit-bg: rgba(113, 157, 246, 0.18);

/*DS:TOKENS:END*/
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 480px; margin: 0 auto; padding-block: 20px 36px; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Encabezado de mes */
.month-bar { display: flex; align-items: center; gap: 8px; }
.month-bar h1 {
  flex: 1; min-width: 0; margin: 0; text-align: center;
  font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: -0.01em; text-wrap: balance;
}
.month-bar h1 small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--muted); letter-spacing: 0.04em; margin-top: 2px; }
.nav-btn {
  width: 48px; height: 48px; flex: none; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center;
}
.nav-btn:active { background: var(--line); }

/* Próximo cambio */
.next {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px;
  display: flex; align-items: center; gap: 12px;
}
.next-text { flex: 1; min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow.late { color: var(--warn); }
.next-date { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin-top: 2px; text-wrap: balance; }
.next .person { margin-top: 8px; }
.mark-btn {
  flex: none; min-height: 48px; padding: 0 16px; border-radius: 14px; font-weight: 600;
  background: var(--ink); color: var(--bg); border: 0;
}
.mark-btn:active { opacity: 0.85; }

/* Persona */
.person {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 8px; border-radius: 999px;
  font-weight: 600; font-size: 15px;
}
.person::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.person.piti { color: var(--piti); background: var(--piti-bg); }
.person.emi { color: var(--emi); background: var(--emi-bg); }

/* Lista de miércoles */
.summary { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); padding-inline: 4px; }
.summary strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row {
  display: grid; grid-template-columns: 60px minmax(0, 1fr) 52px; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 12px 14px;
}
.row.is-today { border-color: var(--ink); border-width: 2px; padding: 11px 13px; }
.row.is-done { background: var(--done-bg); border-color: transparent; }
.date { text-align: center; line-height: 1; }
.date b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; }
.date span { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.who { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.status { font-size: 14px; color: var(--muted); }
.status.late { color: var(--warn); font-weight: 600; }
.status.today { color: var(--ink); font-weight: 600; }
.is-done .status { color: var(--done); font-weight: 600; }
.check {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: transparent; border: 2.5px solid var(--muted); color: transparent;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.check[aria-pressed="true"] { background: var(--done); border-color: var(--done); color: var(--on-done); }
.check:disabled { opacity: 0.6; }

/* Pie */
.foot { font-size: 13px; color: var(--muted); padding-inline: 4px; display: flex; flex-direction: column; gap: 6px; }
.foot .totals { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.foot .totals span { font-variant-numeric: tabular-nums; }
.today-link { align-self: center; background: none; border: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 12px; }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 448px; margin: 0 auto;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 15px; text-align: center;
}
@media (prefers-reduced-motion: reduce) { .check { transition: none; } }

/*DS:LAYER:START*/
/* ── Domésticas · base común (v1) ── */
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 360px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--ds-font-display); letter-spacing: -0.022em; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--ds-tint-soft); }
:focus-visible { outline-color: var(--ds-tint); }
input, select, textarea { accent-color: var(--ds-btn); caret-color: var(--ds-tint); }
@keyframes ds-rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.mark.app-icon, img.app-icon { display: block; overflow: hidden; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
/* ── fin de la base común ── */

/* ── Domésticas · componentes (familia de cuentas: Copec, FAN, Master, LiderBCI) ── */
body { font-size: 17px; line-height: 1.38; }
.app { gap: 20px; padding-block: 14px 48px; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: -0.005em; color: var(--ds-ink-2); }
.muted { color: var(--ds-ink-2); }

/* Encabezado con título grande */
.top { gap: 12px; padding-top: 6px; }
.top h1 { font-size: 34px; line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
.mark {
  width: 46px; height: 46px; border-radius: 13px; color: #fff; background: var(--ds-hero);

<body>

<main class="app" id="app" aria-live="polite"></main>
<div class="pc-host" id="panel-casa"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/*PANEL:START*/
/* Panel Casa: publica en el buzón privado de GitHub un resumen de esta app, para que Panel Casa lo muestre.
   Es el mismo código en Pagos del mes, Balón de gas, Mi cápsula diaria, Mesadas y Sábanas. No se edita en la app:
   se copia desde casa/herramientas/panel-casa.js con  python3 herramientas/conectar-apps.py <carpeta de las apps>
   Uso: PanelCasa.init({ app, title, mount, summary }) al abrir la app y PanelCasa.changed() cada vez que se guarda. */
var PanelCasa = (function () {
  'use strict';
  var KEY = 'panel-casa', REPO_RE = /^[\w.-]+\/[\w.-]+$/;
  var opts = null, cfg = read(), timer = 0, busy = false, again = false, armed = false, editing = false;

  function read() {
    try {
      var c = JSON.parse(localStorage.getItem(KEY) || 'null');
      return c && REPO_RE.test(String(c.r || '')) && typeof c.t === 'string' && c.t.length >= 20 ? c : null;
    } catch (e) { return null; }
  }
  function write() { try { if (cfg) localStorage.setItem(KEY, JSON.stringify(cfg)); else localStorage.removeItem(KEY); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function when(ms) {
    var d = new Date(ms), n = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    var y = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
    var day = d.toDateString() === n.toDateString() ? 'hoy' : d.toDateString() === y.toDateString() ? 'ayer'
      : d.getDate() + ' ' + ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][d.getMonth()];
    return day + ', ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---------- Publicar ---------- */
  async function gh(method, path, body, keep, conn) {
    var c = conn || cfg;
    var r = await fetch('https://api.github.com/repos/' + c.r + path, {
      method: method, cache: 'no-store', keepalive: !!keep,
      headers: { Authorization: 'Bearer ' + c.t, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!r.ok) { var e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  }
  // El resumen va en la descripción de un hito cerrado con el nombre de la app (por ejemplo «Gas · panel»)
  async function send(desc, retried) {
    if (!cfg.m) {
      var list = await gh('GET', '/milestones?state=all&per_page=100');
      var f = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.title === opts.title; })[0];
      if (!f) { cfg.m = (await gh('POST', '/milestones', { title: opts.title, state: 'closed', description: desc })).number; return; }
      cfg.m = f.number;
    }
    try { await gh('PATCH', '/milestones/' + cfg.m, { description: desc }, true); }
    catch (e) { if (e.status === 404 && !retried) { cfg.m = 0; return send(desc, true); } throw e; }
  }
  async function flush() {
    clearTimeout(timer); timer = 0;
    if (!cfg || !opts) return;
    if (busy) { again = true; return; }
    var data;
    try { data = opts.summary(); } catch (e) { data = null; }
    if (!data) return;
    var body = JSON.stringify(data);
    if (body === cfg.h && !cfg.err) return;          // nada cambió desde la última vez
    busy = true;
    var full = { app: opts.app, v: 1, at: Date.now() };
    Object.keys(data).forEach(function (k) { full[k] = data[k]; });
    try { await send(JSON.stringify(full)); cfg.h = body; cfg.ok = full.at; cfg.err = 0; }
    catch (e) { cfg.err = (e && e.status) || 1; }
    if (cfg) write();
    busy = false; paint();
    if (again) { again = false; flush(); }
  }
  function changed() { if (cfg && opts) { clearTimeout(timer); timer = setTimeout(flush, 1200); } }

  /* ---------- Vista: tarjeta «Panel Casa» al final de la app ---------- */
  var I_HOUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3.5 11.2L12 4l8.5 7.2V20a1 1 0 0 1-1 1h-5v-5.5h-5V21h-5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  function status() {
    if (!cfg) return '';
    if (busy) return '<span class="pc-st">Publicando…</span>';
    if (cfg.err === 401) return '<span class="pc-st pc-bad">El token venció: pega un código nuevo</span>';
    if (cfg.err === 403) return '<span class="pc-st pc-bad">El token no puede escribir en el buzón</span>';
    if (cfg.err === 404) return '<span class="pc-st pc-bad">No se encontró el buzón</span>';
    if (cfg.err) return '<span class="pc-st pc-bad">Sin conexión: se publicará al próximo cambio</span>';
    return '<span class="pc-st pc-ok">' + (cfg.ok ? 'Publicó ' + esc(when(cfg.ok)) : 'Conectada') + '</span>';
  }
  function paint() {
    var el = opts && opts.mount;
    if (!el) return;
    var h = '<section class="pc" aria-label="Panel Casa"><div class="pc-head"><span class="pc-ic">' + I_HOUSE + '</span><div><b>Panel Casa</b>' +
      (cfg ? status() : '<span class="pc-st">Sin conectar</span>') + '</div></div>';
    if (cfg && !editing) {
      h += '<p class="pc-p">Lo que anotas aquí se ve también en Panel Casa.</p><div class="pc-btns">' +
        '<button type="button" class="pc-btn" data-pc="now">Publicar ahora</button>' +
        '<button type="button" class="pc-btn pc-danger' + (armed ? ' pc-armed' : '') + '" data-pc="off">' + (armed ? 'Toca de nuevo' : 'Desconectar') + '</button></div>';
    } else {
      h += '<p class="pc-p">Para ver esta app en Panel Casa: en el panel, abre Conexiones y toca «Copiar código para las apps». Luego vuelve aquí.</p>';
      if (editing) {
        h += '<textarea class="pc-ta" id="pc-ta" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Pega aquí el código (empieza con CASA1.)"></textarea>' +
          '<div class="pc-btns"><button type="button" class="pc-btn pc-main" data-pc="save">Conectar</button><button type="button" class="pc-btn" data-pc="cancel">Cancelar</button></div>';
      } else {
        h += '<div class="pc-btns"><button type="button" class="pc-btn pc-main" data-pc="paste">Pegar código</button></div>';
      }
      h += '<p class="pc-err" id="pc-err" hidden></p>';
    }
    el.innerHTML = h + '</section>';
  }
  function parseCode(text) {
    var m = /CASA1\.([A-Za-z0-9+\/=]+)/.exec(String(text || ''));
    if (!m) return null;
    try {
      var o = JSON.parse(atob(m[1]));
      return o && REPO_RE.test(String(o.r || '')) && typeof o.t === 'string' && o.t.trim().length >= 20 ? { r: String(o.r), t: o.t.trim() } : null;
    } catch (e) { return null; }
  }
  function connect(text) {
    var c = parseCode(text);
    if (!c) return false;
    cfg = { r: c.r, t: c.t, m: 0, h: '', ok: 0, err: 0 };
    editing = false; write(); paint(); flush();
    return true;
  }
  function showErr(msg) { var e = document.getElementById('pc-err'); if (e) { e.textContent = msg; e.hidden = false; } }
  function onClick(ev) {
    var b = ev.target.closest && ev.target.closest('[data-pc]');
    if (!b || !opts || !opts.mount.contains(b)) return;
    var a = b.getAttribute('data-pc');
    if (a === 'paste') {
      // Primero intenta leer el portapapeles; si el iPhone no lo permite, muestra un campo para pegar
      var manual = function () { editing = true; paint(); var t = document.getElementById('pc-ta'); if (t) t.focus(); };
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (txt) { if (!connect(txt)) manual(); }, manual);
      } else manual();
    } else if (a === 'save') {
      var t = document.getElementById('pc-ta');
      if (!connect(t ? t.value : '')) showErr('Ese no es el código del panel. Cópialo de nuevo en Panel Casa → Conexiones.');
    } else if (a === 'cancel') { editing = false; paint(); }
    else if (a === 'now') { if (cfg) { cfg.h = ''; flush(); paint(); } }
    else if (a === 'off') {
      if (!armed) { armed = true; paint(); setTimeout(function () { armed = false; paint(); }, 4000); return; }
      armed = false;
      var old = cfg; cfg = null; write(); paint();
      // El hito queda vacío para que el panel no siga mostrando datos viejos
      if (old && old.m) gh('PATCH', '/milestones/' + old.m, { description: '' }, null, false, old).catch(function () {});
    }
  }

  function init(o) {
    opts = o;
    if (!opts || typeof opts.summary !== 'function') return;
    if (opts.mount) { paint(); opts.mount.addEventListener('click', onClick); }
    if (cfg) setTimeout(flush, 1500);
    // Al salir de la app se publica lo que esté pendiente
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && timer) flush(); });
  }
  return { init: init, changed: changed };
})();
/*PANEL:END*/
</script>
<script>
(function () {
  // Primer turno: miércoles 7 de octubre de 2026, le toca a Piti. Desde ahí se alterna cada semana.
  var ANCHOR = Date.UTC(2026, 9, 7);
  var PEOPLE = ['Piti', 'Emi'];
  var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var CHECK_SVG = '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHEV_L = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var CHEV_R = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var done = new Set();
  var busy = new Set();
  var LS_KEY = 'cambio-sabanas-hechos';
  var now = new Date();
  var view = { y: now.getFullYear(), m: now.getMonth() };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parseKey(k) { var p = k.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
  function turno(y, m, d) {
    var n = Math.round((Date.UTC(y, m, d) - ANCHOR) / 604800000);
    return ((n % 2) + 2) % 2;
  }
  function miercoles(y, m) {
    var out = [], dim = new Date(y, m + 1, 0).getDate();
    for (var d = 1; d <= dim; d++) if (new Date(y, m, d).getDay() === 3) out.push(d);
    return out;
  }
  function label(y, m, d) { return 'miércoles ' + d + ' de ' + MESES[m].toLowerCase(); }
  function todayKey() { var t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); }
  function personHtml(i) { return '<span class="person ' + (i === 0 ? 'piti' : 'emi') + '">' + PEOPLE[i] + '</span>'; }

  function loadLocal() {
    try { var raw = localStorage.getItem(LS_KEY); if (raw) JSON.parse(raw).forEach(function (k) { done.add(k); }); } catch (e) {}
  }
  function saveLocal() {
    localStorage.setItem(LS_KEY, JSON.stringify(Array.from(done)));
    if (window.PanelCasa) PanelCasa.changed();
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3500);
  }

  // Primer miércoles sin check, desde el inicio del registro
  function firstPending() {
    var t = new Date(2026, 9, 7);
    for (var i = 0; i < 260; i++) {
      var k = keyOf(t.getFullYear(), t.getMonth(), t.getDate());
      if (!done.has(k)) return { y: t.getFullYear(), m: t.getMonth(), d: t.getDate(), k: k };
      t.setDate(t.getDate() + 7);
    }
    return null;
  }

  function render() {
    var tk = todayKey();
    var days = miercoles(view.y, view.m);
    var nextP = firstPending();
    var html = '';

    html += '<header class="top"><img class="mark app-icon" src="icons/apple-touch-icon.png" alt=""><div><div class="eyebrow">Piti y Emi · cada miércoles</div><h1>Sábanas</h1></div></header>';
    html += '<div class="month-bar">' +
      '<button class="nav-btn" data-nav="-1" aria-label="Mes anterior">' + CHEV_L + '</button>' +
      '<h2>' + MESES[view.m] + ' ' + view.y + '<small>' + days.length + ' miércoles</small></h2>' +
      '<button class="nav-btn" data-nav="1" aria-label="Mes siguiente">' + CHEV_R + '</button></div>';

    if (nextP) {
      var late = nextP.k < tk, isToday = nextP.k === tk;
      var cap = late ? 'Atrasado' : (isToday ? 'Hoy' : 'Próximo cambio');
      html += '<section class="next" aria-label="Próximo cambio">' +
        '<div class="next-text"><div class="eyebrow' + (late ? ' late' : '') + '">' + cap + '</div>' +
        '<div class="next-date">' + label(nextP.y, nextP.m, nextP.d) + '</div>' +
        '<div class="person-wrap">' + personHtml(turno(nextP.y, nextP.m, nextP.d)) + '</div></div>' +
        ((late || isToday) ? '<button class="mark-btn" data-key="' + nextP.k + '">Marcar hecho</button>' : '') +
        '</section>';
    }

    var hechos = days.filter(function (d) { return done.has(keyOf(view.y, view.m, d)); }).length;
    html += '<div class="summary"><span>Cambios del mes</span><strong>' + hechos + ' de ' + days.length + ' hechos</strong></div>';

    html += '<ul class="list">';
    days.forEach(function (d) {
      var k = keyOf(view.y, view.m, d);
      var p = turno(view.y, view.m, d);
      var isDone = done.has(k);
      var before = Date.UTC(view.y, view.m, d) < ANCHOR;
      var status, cls = '';
      if (isDone) status = 'Hecho';
      else if (before) status = 'Anterior al registro';
      else if (k === tk) { status = 'Hoy'; cls = ' today'; }
      else if (k < tk) { status = 'Atrasado'; cls = ' late'; }
      else if (nextP && k === nextP.k) status = 'Próximo';
      else status = 'Programado';
      html += '<li class="row' + (isDone ? ' is-done' : '') + (k === tk ? ' is-today' : '') + '">' +
        '<div class="date"><b>' + d + '</b><span>mié</span></div>' +
        '<div class="who">' + personHtml(p) + '<span class="status' + cls + '">' + status + '</span></div>' +
        '<button class="check" data-key="' + k + '" aria-pressed="' + isDone + '"' + (busy.has(k) ? ' disabled' : '') +
        ' aria-label="Cambio de sábanas, ' + label(view.y, view.m, d) + ', ' + PEOPLE[p] + '">' + CHECK_SVG + '</button>' +
        '</li>';
    });
    html += '</ul>';

    var cnt = [0, 0];
    done.forEach(function (k) { var o = parseKey(k); cnt[turno(o.y, o.m, o.d)]++; });
    html += '<div class="foot"><div class="totals"><span>Registrados en total:</span><span>' + PEOPLE[0] + ' ' + cnt[0] + '</span><span>' + PEOPLE[1] + ' ' + cnt[1] + '</span></div>' +
      '<div>Empieza Piti el miércoles 7 de octubre de 2026 y se alterna cada semana.</div>' +
      '<div>Los cambios marcados se guardan solo en este dispositivo.</div></div>';

    if (view.y !== now.getFullYear() || view.m !== now.getMonth()) {
      html += '<button class="today-link" data-nav="today">Volver a este mes</button>';
    }
    app.innerHTML = html;
  }

  async function toggle(k) {
    if (busy.has(k)) return;
    busy.add(k);
    var was = done.has(k);
    if (was) done.delete(k); else done.add(k);
    render();
    try {
      saveLocal();
    } catch (e) {
      if (was) done.add(k); else done.delete(k);
      toast('No se pudo guardar el cambio. Intenta de nuevo.');
    } finally {
      busy.delete(k);
      render();
    }
  }

  app.addEventListener('click', function (ev) {
    var nav = ev.target.closest('[data-nav]');
    if (nav) {
      var v = nav.getAttribute('data-nav');
      if (v === 'today') { var t = new Date(); view = { y: t.getFullYear(), m: t.getMonth() }; }
      else {
        var m = view.m + parseInt(v, 10), y = view.y;
        if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
        view = { y: y, m: m };
      }
      render();
      return;
    }
    var btn = ev.target.closest('[data-key]');
    if (btn) toggle(btn.getAttribute('data-key'));
  });

  loadLocal();
  render();

  // Al volver a la app (por ejemplo, la semana siguiente) se actualiza la fecha de hoy.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    var enMesActual = view.y === now.getFullYear() && view.m === now.getMonth();
    now = new Date();
    if (enMesActual) view = { y: now.getFullYear(), m: now.getMonth() };
    render();
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
/*PANEL:APP:START*/
  // Panel Casa: los últimos miércoles marcados y el primero que falta
  if (window.PanelCasa) PanelCasa.init({ app: 'sabanas', title: 'Sábanas · panel', mount: document.getElementById('panel-casa'), summary: function () {
    var list = Array.from(done).filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }).sort();
    var p = firstPending();
    return { hechos: list.slice(-12), pend: p ? p.k : '' };
  } });
/*PANEL:APP:END*/
})();
</script>

<script>
// Sin zoom con los dedos: Safari en iPhone no siempre respeta «user-scalable=no», así que se cortan sus gestos de zoom
(function () {
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
})();
</script>
</body>
</html>
